# ============================================================
# nginx.conf — TiTiler 캐싱 프록시 + VWorld 오프라인 타일 정적 서버 (개발 환경)
#
# Frontend dev host entrypoint (0.0.0.0:18210 -> container:5173)
# → vite proxy `/titiler` → nginx (이 컨테이너) → titiler:8000
# 한 번 생성된 타일을 디스크 캐시에 보존해 두 번째 요청부터 GDAL 처리 skip.
#
# Frontend dev host entrypoint (0.0.0.0:18210 -> container:5173)
# → vite proxy `/vworld` → nginx (이 컨테이너) → 로컬 파일
# 오프라인 VWorld 베이스맵 타일을 정적 서빙 (z/x/y.jpg, EPSG:3857 XYZ).
# ============================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    gzip off;  # 타일은 이미 압축됨 (PNG/WebP/JPG)

    # ---- 캐시 zone: 디스크 4GB, 메모리 인덱스 100MB, 7일 보존 ----
    proxy_cache_path /var/cache/nginx/titiler
        levels=1:2
        keys_zone=titiler_cache:100m
        max_size=4g
        inactive=7d
        use_temp_path=off;

    upstream titiler_backend {
        server titiler:8000;
        keepalive 32;
    }

    server {
        listen 8000;
        server_name _;

        # 큰 응답 버퍼링 — 큰 PNG tile 도 한번에
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;

        # CORS — frontend 가 직접 호출
        add_header Access-Control-Allow-Origin "*" always;

        # ---- /cog/* — 캐시 활성 ----
        location /cog/ {
            proxy_pass http://titiler_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # 캐시 정책
            proxy_cache titiler_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;

            # 클라이언트에 캐시 hit/miss 표시 (디버그)
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # ---- /vworld/{z}/{x}/{y}.jpg — VWorld 오프라인 타일 정적 서빙 ----
        # 호스트의 vworld_tiles 디렉토리가 /data/vworld_tiles 로 마운트됨.
        # XYZ 스킴 (Leaflet 기본). 좌표계 EPSG:3857. z=5~16.
        location /vworld/ {
            alias /data/vworld_tiles/;
            # 누락 타일(바다·해외 영역)은 빈 응답 — Leaflet 이 깨진 이미지 표시 안 함.
            try_files $uri =204;
            # 브라우저 캐시 30일 — 타일은 불변.
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            # 디렉토리 인덱스 노출 차단.
            autoindex off;
        }

        # ---- 그 외 (info, tilejson, bounds 등) — 짧은 캐시 ----
        location / {
            proxy_pass http://titiler_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_cache titiler_cache;
            proxy_cache_valid 200 5m;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
